[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agimaze-predict"
version = "0.1.0"
description = "Prediction baselines and shared data utilities for AGI Maze datasets"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.3"]
test = ["pytest>=8"]
llama = [
  "torch>=2.3",
  "transformers>=4.45,<5",
  "accelerate>=0.34",
  "peft>=0.12",
  "safetensors>=0.4",
]
# Install bitsandbytes separately on the target CUDA host when QLoRA is wanted.
# Its compatible wheel depends on the CUDA and GPU-driver combination.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
