# Canonical byte-Transformer training experiment - example config with comments.
# Paths are relative to this TOML file, so committed experiment configurations are
# portable across working directories. Command-line options override these values.

[data]
# Combine any number of independently composed JSONL shards in the listed order.
train_files = [
  "../datasets/per_step/3x3-keys-rnd-train.jsonl",
  "../datasets/per_step/4x4-keys-rnd-train.jsonl"
  # "../datasets/per_step/4x4-rivers.jsonl",
]
# `test_files` is an alias for `validation_files`.
# The validation subset can differ from the training subset if needed
test_files = ["../datasets/per_step/3x3-keys-rnd-valid.jsonl"]

[model]
context_length = 512
# Latent-code / Transformer hidden dimension. Must be divisible by n_heads.
d_model = 128
n_heads = 4
n_layers = 4
mlp_multiplier = 4
dropout = 0.0
# Fixed latent slots inserted after every complete <ACT>...</ACT> block.
# 0 preserves the original literal-byte serialization exactly.
state_tokens = 0

[training]
seed = 0
epochs = 50
evaluate_every = 5
batch_size = 32
learning_rate = 0.0003
weight_decay = 0.01
grad_clip = 1.0

[run]
output = "../runs/byte-transformer-v0a.pt"
overwrite = false
# device = "cuda"
# Enable error log to examine wrongly predicted samples
# validation_greedy_error_log = "../runs/validation-errors.txt"
