# Control for 3x3 keys, 4-step prediction: the target-aligned decoder and its
# loss are active, but aux states cannot enter the main stream. Compare this
# arm directly against 3x3-keys-4step.toml (gate on) and the plain byte model.

[data]
train_files = [
    "../../../datasets/seq/3x3-keys-2step-rnd-train1.jsonl",
    "../../../datasets/seq/3x3-keys-2step-rnd-train2.jsonl",
    "../../../datasets/seq/3x3-keys-8step-rnd-train1.jsonl",
    "../../../datasets/seq/3x3-keys-8step-rnd-train2.jsonl",
    "../../../datasets/seq/3x3-keys-4step-rnd-train1.jsonl",
    "../../../datasets/seq/3x3-keys-4step-rnd-train2.jsonl"
]
validation_files = ["../../../datasets/seq/3x3-keys-4step-rnd-valid.jsonl"]

[model]
context_length = 512
d_model = 128
n_heads = 4
n_layers = 4
mlp_multiplier = 4
dropout = 0.0
aux_latents_per_token = 1
aux_gate_mode = "off"
aux_gate_init = 0.05
aux_scale = 1.0
aux_target_weight = 0.1
aux_target_decoder_layers = 1

[training]
seed = 111
epochs = 300
evaluate_every = 5
batch_size = 32
learning_rate = 0.0002
weight_decay = 0.01
grad_clip = 1.0

[run]
output = "../../../runs/aux-transformer-3x3-keys-4step-target-head-gate-off.pt"
overwrite = false
