# Rational agent training - 2-step prediction with action loss

[data]
train_files = [
    "../../../datasets/seq/3x3-keys-rational-train1-1step.jsonl",
    "../../../datasets/seq/3x3-keys-rational-train2-1step.jsonl",
    "../../../datasets/seq/3x3-keys-rational-train1-2step.jsonl",
    "../../../datasets/seq/3x3-keys-rational-train2-2step.jsonl",
    "../../../datasets/seq/3x3-keys-rational-train1-4step.jsonl",
    "../../../datasets/seq/3x3-keys-rational-train2-4step.jsonl",
    "../../../datasets/seq/3x3-keys-rational-train1-8step.jsonl",
    "../../../datasets/seq/3x3-keys-rational-train2-8step.jsonl",
]
validation_files = [
    "../../../datasets/seq/3x3-keys-rational-valid-4step.jsonl",
    "../../../datasets/seq/3x3-keys-rational-valid-8step.jsonl"
]

[model]
context_length = 768  # Slightly smaller for 2-step
d_model = 256
n_heads = 4
n_layers = 5
mlp_multiplier = 4
dropout = 0.0

[training]
seed = 42
epochs = 150
evaluate_every = 5
batch_size = 32
learning_rate = 0.0002
weight_decay = 0.01
grad_clip = 1.0

[run]
output = "../../../runs/rational-3x3-keys-mixed.pt"
overwrite = true
