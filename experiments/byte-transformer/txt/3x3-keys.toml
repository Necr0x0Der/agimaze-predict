# TXT-trace rollout experiment. Run with:
# python scripts/train_txt_byte_transformer.py --config experiments/byte-transformer/txt/3x3-keys.toml
#
# `initial_context` selects exactly one initial representation.  MAP is the
# rendered board; START is the textual initial observation.  During training,
# ACT-TXT-ACT-TXT... is expanded to `depth` pairs. Loss is computed only on each
# complete <TXT>...</TXT> block; prior TXT blocks are ground truth context.

[data]
train_files = [
    "../../../datasets/txt/3x3-keys-rnd-train1.jsonl",
    "../../../datasets/txt/3x3-keys-rnd-train2.jsonl"
]
validation_files = ["../../../datasets/txt/3x3-keys-rnd-valid.jsonl"]
initial_context = "MAP" # exactly "MAP" or "START"
depth = 8

[model]
# Text observations can be verbose; raise this after measuring real traces.
context_length = 2048
d_model = 256
n_heads = 4
n_layers = 5
mlp_multiplier = 4
dropout = 0.0

[training]
seed = 111
epochs = 250
evaluate_every = 5
batch_size = 32
learning_rate = 0.0002
weight_decay = 0.01
grad_clip = 1.0

[run]
output = "../../../runs/byte-transformer-txt-3x3-keys.pt"
overwrite = true
# device = "cuda"
