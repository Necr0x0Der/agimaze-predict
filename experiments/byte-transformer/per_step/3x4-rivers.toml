# Canonical byte-Transformer training experiment on the simplest dataset.

[data]
train_files = [
    "../../../datasets/per_step/3x4-rivers-rnd-train1.jsonl",
    "../../../datasets/per_step/3x4-rivers-rnd-train2.jsonl",
    "../../../datasets/per_step/3x3-keys-rnd-train.jsonl",
    "../../../datasets/per_step/4x4-keys-rnd-train.jsonl",
    "../../../datasets/per_step/3x3-rivers-rnd-train.jsonl"
]
validation_files = ["../../../datasets/per_step/3x4-rivers-rnd-valid.jsonl"]

[model]
context_length = 512
d_model = 256
n_heads = 4
n_layers = 4
mlp_multiplier = 4
dropout = 0.0

[training]
seed = 111
epochs = 250
evaluate_every = 5
batch_size = 32
learning_rate = 0.0002
weight_decay = 0.01
grad_clip = 1.0

[run]
output = "../../../runs/byte-transformer-3x4-rivers.pt"
overwrite = true
# device = "cuda"
# validation_greedy_error_log = "../../../runs/validation-errors.txt"
